<a class="logo" href="#/panel" aria-label="Blush ERP, ir al panel">serena<span>|</span><em>blush</em></a>

<div class="herramientas">
  <label class="buscador">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <span class="oculto">Buscar en el módulo actual</span>
    <input id="buscar" type="search" placeholder="Buscar…" autocomplete="off" disabled>
    <kbd aria-hidden="true">/</kbd>
  </label>
  <button id="nuevo" class="boton boton--principal" type="button" disabled>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span class="texto-largo">Nuevo</span>
  </button>
</div>

<div class="usuario">
  <button id="tema" class="boton-icono" type="button" aria-label="Cambiar a modo oscuro">
    <svg class="luna" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  </button>
  <button id="cuenta" class="cuenta" type="button" title="Cambiar mi contraseña">
    <span class="avatar" id="usuario-iniciales" aria-hidden="true"></span>
    <span class="usuario-nombre">
      <strong id="usuario-nombre"></strong>
      <small id="usuario-rol"></small>
    </span>
  </button>
  <button id="salir" class="boton-icono" type="button" aria-label="Cerrar sesión" title="Cerrar sesión"></button>
</div>
